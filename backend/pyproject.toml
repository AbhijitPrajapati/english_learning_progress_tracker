[project]
name = "backend"
version = "0.1.0"
description = "Backend for English learning progress tracker"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.140.7",
    "faster-whisper>=1.2.1",
    "psycopg>=3.3.4",
    "sqlalchemy>=2.0.51",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]